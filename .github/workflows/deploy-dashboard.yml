name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: dashboard
        run: npm install

      - name: Build
        working-directory: dashboard
        env:
          # Point this at your repo's raw state.json (edit YOUR_USERNAME/YOUR_REPO)
          VITE_STATE_URL: https://raw.githubusercontent.com/mario4l/graciebarra-gardengrove-tracker/main/data/state.json
          # If deploying to https://<user>.github.io/<repo>/, set to "/<repo>/"
          VITE_BASE_PATH: /graciebarra-gardengrove-tracker/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
